<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de resultados — Seguridad del paciente HUVR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2B24;
    --ink-soft:#57685F;
    --bg:#F5F8F6;
    --card:#FFFFFF;
    --line:#DCE6DF;
    --accent:#1F6B3A;
    --good:#1F7A5C;
    --warn:#C98A1E;
    --bad:#B14A1F;
    --track:#E4EDE7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Public Sans',-apple-system,sans-serif;
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:860px;margin:0 auto;}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  header img{height:46px;width:auto;}
  h1{font-size:22px;margin:0;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;}
  .stat-num{font-size:30px;font-weight:800;color:var(--accent);line-height:1.1;letter-spacing:-0.02em;}
  .stat-lab{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:4px;}

  h2{font-size:15px;margin:26px 0 12px;letter-spacing:-0.005em;}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;}

  .qrow{padding:13px 0;border-bottom:1px solid var(--line);}
  .qrow:last-child{border-bottom:none;}
  .qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:7px;}
  .qtext{font-size:13.5px;font-weight:600;line-height:1.4;flex:1;}
  .qpct{font-size:15px;font-weight:800;white-space:nowrap;}
  .qpct.good{color:var(--good);}
  .qpct.warn{color:var(--warn);}
  .qpct.bad{color:var(--bad);}
  .bar{height:8px;background:var(--track);border-radius:5px;overflow:hidden;}
  .bar span{display:block;height:100%;border-radius:5px;}
  .bar span.good{background:var(--good);}
  .bar span.warn{background:var(--warn);}
  .bar span.bad{background:var(--bad);}

  .dist{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:6px;}
  .dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;}
  .dbar{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;}
  .dlab{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .dval{font-size:11px;font-weight:700;color:var(--ink);}

  .msg{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;}
  .msg strong{color:var(--ink);}
  code{background:#EDF2EE;padding:2px 6px;border-radius:5px;font-size:12.5px;}
  .foot{margin-top:24px;font-size:12.5px;color:var(--ink-soft);}
  button{
    appearance:none;border:none;background:var(--ink);color:#fff;font-family:inherit;
    font-size:14px;font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer;margin-top:18px;
  }
</style>
</head>

    <div>
      <h1>Panel de resultados</h1>
    </div>
  </header>
  <p class="sub">Cuestionario de seguridad del paciente · datos anónimos agregados</p>

  <div id="content">
    <div class="msg">Cargando datos…</div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
/* ============================================================
   PEGA AQUÍ LA MISMA CONFIGURACIÓN QUE EN EL CUESTIONARIO
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD5GT_HFqb538xgGlaXZ7FmT5y00LRtFu4",
  authDomain: "test-seguridad-paciente-huvr.firebaseapp.com",
  projectId: "test-seguridad-paciente-huvr",
  storageBucket: "test-seguridad-paciente-huvr.firebasestorage.app",
  messagingSenderId: "596274498723",
  appId: "1:596274498723:web:9dbde33b96236e05e94316",
  measurementId: "G-TXHK54E8X9"
};

/* Textos cortos de las 8 preguntas, en el mismo orden que el cuestionario */
const PREGUNTAS = [
  "En el hospital hay profesionales que gestionan la seguridad del paciente",
  "¿Quién forma la estructura de seguridad del HUVR?",
  "Ampollas de distintos fármacos mezcladas en el cajón",
  "Paciente se cae de la cama y se rompe la cadera",
  "Fármaco no prescrito administrado, sin daño",
  "Bolsa de sangre equivocada detectada antes de transfundir",
  "Profesional se cae en el vestuario",
  "Paciente operado por error de la vesícula"
];

const TOTAL = PREGUNTAS.length;
const content = document.getElementById('content');

function claseP(p){ return p >= 75 ? 'good' : (p >= 50 ? 'warn' : 'bad'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function cargar(){
  if(FIREBASE_CONFIG.projectId.startsWith('PEGA_AQUI')){
    content.innerHTML =
      '<div class="msg"><strong>Falta configurar Firebase.</strong><br><br>' +
      'Abre este archivo con un editor de texto, busca <code>PEGA_AQUI</code> y sustituye los valores ' +
      'por los mismos que pusiste en el cuestionario. Después vuelve a subirlo.</div>';
    return;
  }

  try{
    const [{ initializeApp }, fs] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);

    const app = initializeApp(FIREBASE_CONFIG);
    const dbfs = fs.getFirestore(app);
    const snap = await fs.getDocs(fs.collection(dbfs, 'respuestas_quiz'));

    let n = 0, suma = 0, perfectos = 0;
    let perQ = new Array(TOTAL).fill(0);
    let dist = new Array(TOTAL + 1).fill(0);   // 0..8 aciertos
    let ultima = null;

    snap.forEach(doc => {
      const d = doc.data();
      if(typeof d.aciertos !== 'number') return;
      n++;
      suma += d.aciertos;
      if(d.aciertos === TOTAL) perfectos++;
      if(d.aciertos >= 0 && d.aciertos <= TOTAL) dist[d.aciertos]++;
      if(Array.isArray(d.porPregunta)){
        d.porPregunta.forEach((v,i)=>{ if(i < TOTAL) perQ[i] += (v ? 1 : 0); });
      }
      if(d.fecha && (!ultima || d.fecha > ultima)) ultima = d.fecha;
    });

    if(n === 0){
      content.innerHTML = '<div class="msg"><strong>Todavía no hay respuestas registradas.</strong><br><br>' +
        'En cuanto alguien complete el cuestionario, aquí aparecerán las estadísticas.</div>';
      return;
    }

    const media = suma / n;
    const pctMedio = Math.round(media / TOTAL * 100);

    // Ordenar preguntas por dificultad (menor % acierto primero)
    const ranking = perQ
      .map((ac,i)=>({i, pct: Math.round(ac / n * 100)}))
      .sort((a,b)=>a.pct - b.pct);

    let html = '';

    html += '<div class="cards">' +
      '<div class="stat"><div class="stat-num">' + n + '</div><div class="stat-lab">Participantes</div></div>' +
      '<div class="stat"><div class="stat-num">' + media.toFixed(1) + '</div><div class="stat-lab">Media de aciertos (de ' + TOTAL + ')</div></div>' +
      '<div class="stat"><div class="stat-num">' + pctMedio + '%</div><div class="stat-lab">Porcentaje medio de acierto</div></div>' +
      '<div class="stat"><div class="stat-num">' + perfectos + '</div><div class="stat-lab">Cuestionarios perfectos</div></div>' +
    '</div>';

    html += '<h2>Preguntas ordenadas por dificultad</h2><div class="panel">';
    ranking.forEach(r => {
      const c = claseP(r.pct);
      html += '<div class="qrow">' +
        '<div class="qhead"><div class="qtext">' + (r.i+1) + '. ' + esc(PREGUNTAS[r.i]) + '</div>' +
        '<div class="qpct ' + c + '">' + r.pct + '%</div></div>' +
        '<div class="bar"><span class="' + c + '" style="width:' + r.pct + '%"></span></div>' +
      '</div>';
    });
    html += '</div>';

    html += '<h2>Distribución de resultados</h2><div class="panel"><div class="dist">';
    const maxD = Math.max(...dist, 1);
    dist.forEach((c, aciertos) => {
      const h = Math.round(c / maxD * 100);
      html += '<div class="dcol">' +
        '<div class="dval">' + (c || '') + '</div>' +
        '<div class="dbar" style="height:' + h + '%"></div>' +
        '<div class="dlab">' + aciertos + '</div>' +
      '</div>';
    });
    html += '</div><div class="dlab" style="text-align:center;margin-top:8px;">Número de aciertos obtenidos</div></div>';

    html += '<button onclick="location.reload()">Actualizar datos</button>';

    content.innerHTML = html;

    if(ultima){
      document.getElementById('foot').textContent =
        'Última respuesta registrada: ' + new Date(ultima).toLocaleString('es-ES');
    }

  }catch(err){
    console.error(err);
    content.innerHTML = '<div class="msg"><strong>No se han podido cargar los datos.</strong><br><br>' +
      'Comprueba que la configuración de Firebase sea correcta y que las reglas de Firestore permitan la lectura. ' +
      'Detalle técnico: ' + esc(err.message) + '</div>';
  }
}

cargar();
</script>
